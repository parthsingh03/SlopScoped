<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SlopScoped — scoping…</title>
<script>
  /* SPA fallback for GitHub Pages (case preserved):
     /SlopScoped/<username>       -> /SlopScoped/?u=<username>
     /SlopScoped/<owner>/<repo>  -> /SlopScoped/?r=<owner>/<repo> */
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = '';
    if (parts.length && parts[0].toLowerCase() === 'slopscoped') { base = '/' + parts[0]; parts.shift(); }
    var target;
    if (parts.length >= 2) {
      target = base + '/?r=' + encodeURIComponent(decodeURIComponent(parts[0])) + '/' + encodeURIComponent(decodeURIComponent(parts[1]));
    } else if (parts.length === 1) {
      target = base + '/?u=' + encodeURIComponent(decodeURIComponent(parts[0]));
    } else {
      target = base + '/';
    }
    location.replace(target);
  })();
</script>
</head>
<body><p>Scoping…</p></body>
</html>
